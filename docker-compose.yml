services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.05.0
    # # For DHCP it is recommended to remove these ports and instead add: network_mode: "host"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      # - "67:67/udp" # Only required if you are using Pi-hole as your DHCP server
      - "8090:80/tcp"
    # network_mode: host
    dns:
      - 127.0.0.1
      - 8.8.8.8
      - 1.1.1.1
    environment:
      TZ: America/Santiago
      SET_CONTAINER_TIMEZONE: 'true'
      CONTAINER_TIMEZONE: America/Santiago
      WEBPASSWORD: ${WEBPASSWORD:-}
      PIHOLE_DNS_1: cloudflared-doh:5053
      PIHOLE_DNS_2: 1.1.1.1
      FTLCONF_dns_listeningMode: 'all'
    depends_on:
      cloudflared-doh:
        condition: service_started
    # Volumes store your data between container upgrades
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
      - './adlists.list:/etc/pihole/adlists.list'
    #   https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
    # cap_add:
    #  - NET_ADMIN # Required if you are using Pi-hole as your DHCP server, else not needed
    healthcheck:
      test:
        - CMD-SHELL
        - dig @127.0.0.1 +time=2 +tries=1 google.com > /dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
  cloudflared-doh:
    container_name: cloudflared-doh
    image: crazymax/cloudflared:latest
    command:
      - proxy-dns
      - --port
      - "5053"
      - --address
      - 0.0.0.0
      - --upstream
      - https://1.1.1.1/dns-query
      - --upstream
      - https://1.1.1.2/dns-query
      - --upstream
      - https://1.0.0.1/dns-query
      - --upstream
      - https://1.0.0.2/dns-query
      - --upstream
      - https://dns.google/dns-query
      - --upstream
      - https://dns.quad9.net/dns-query
    expose:
      - "5053/tcp"
      - "5053/udp"
    restart: unless-stopped
  gluetun:
    container_name: gluetun
    image: ghcr.io/qdm12/gluetun:latest
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: America/Santiago
      DNS_UPSTREAM_RESOLVER_TYPE: dot
      DNS_UPSTREAM_RESOLVERS: cloudflare
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
      SOCKS5_ENABLED: "on"
      SOCKS5_LISTENING_ADDRESS: ":1080"
      FIREWALL_INPUT_PORTS: "53,8000,8888,1080"
      DNS_SERVER: "on"
      DNS_KEEP_NAMESERVER: ${DNS_KEEP_NAMESERVER:-off}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:?Set VPN_SERVICE_PROVIDER in .env}
      VPN_TYPE: ${VPN_TYPE:-openvpn}
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      FREE_ONLY: ${FREE_ONLY:-off}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-off}
      HTTPPROXY_USER: ${HTTPPROXY_USER:?Set HTTPPROXY_USER in .env}
      HTTPPROXY_PASSWORD: ${HTTPPROXY_PASSWORD:?Set HTTPPROXY_PASSWORD in .env}
      SOCKS5_USER: ${SOCKS5_USER:?Set SOCKS5_USER in .env}
      SOCKS5_PASSWORD: ${SOCKS5_PASSWORD:?Set SOCKS5_PASSWORD in .env}
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"${GLUETUN_API_KEY:?Set GLUETUN_API_KEY in .env}"}'
    expose:
      - "53/tcp"
      - "53/udp"
      - "8000/tcp"
    ports:
      - "127.0.0.1:8888:8888/tcp"
      - "127.0.0.1:1080:1080/tcp"
    restart: unless-stopped
  gluetun-webui:
    container_name: gluetun-webui
    image: scuzza/gluetun-webui:main-268a3f3
    environment:
      GLUETUN_CONTROL_URL: http://gluetun:8000
      GLUETUN_API_KEY: ${GLUETUN_API_KEY:?Set GLUETUN_API_KEY in .env}
    depends_on:
      gluetun:
        condition: service_started
    ports:
      - "3888:3000/tcp"
    restart: unless-stopped
