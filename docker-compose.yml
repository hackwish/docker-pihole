services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.05.0
    # # For DHCP it is recommended to remove these ports and instead add: network_mode: "host"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      # - "67:67/udp" # Only required if you are using Pi-hole as your DHCP server
      - "8090:80/tcp"
    # network_mode: host
    dns:
      - 127.0.0.1
      - 8.8.8.8
      - 1.1.1.1
    environment:
      TZ: America/Santiago
      SET_CONTAINER_TIMEZONE: 'true'
      CONTAINER_TIMEZONE: America/Santiago
      WEBPASSWORD: ${WEBPASSWORD:-}
      PIHOLE_DNS_1: cloudflared-doh:5053
      PIHOLE_DNS_2: 1.1.1.1
      FTLCONF_dns_listeningMode: 'all'
    depends_on:
      cloudflared-doh:
        condition: service_started
    # Volumes store your data between container upgrades
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
      - './adlists.list:/etc/pihole/adlists.list:ro'
    #   https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
    # cap_add:
    #  - NET_ADMIN # Required if you are using Pi-hole as your DHCP server, else not needed
    healthcheck:
      test:
        - CMD-SHELL
        - dig @127.0.0.1 +time=2 +tries=1 google.com > /dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
  cloudflared-doh:
    container_name: cloudflared-doh
    image: crazymax/cloudflared:latest
    command:
      - proxy-dns
      - --port
      - "5053"
      - --address
      - 0.0.0.0
      - --upstream
      - https://1.1.1.1/dns-query
      - --upstream
      - https://1.1.1.2/dns-query
      - --upstream
      - https://1.0.0.1/dns-query
      - --upstream
      - https://1.0.0.2/dns-query
    expose:
      - "5053/tcp"
      - "5053/udp"
    restart: unless-stopped
